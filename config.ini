# ========================================
# Telegram MTProto WS Proxy Configuration
# ========================================

# Адрес для прослушивания
host = 127.0.0.1

# Порт для прослушивания
port = 1443

# MTProto secret (32 hex символа)
# Если пусто - будет сгенерирован автоматически
secret = 332dad4247168d02e2b5d2e366482002

# Размер буфера сокета в байтах
buffer_size = 262144

# Размер пула WebSocket соединений
pool_size = 4

# Принудительно использовать тестовые DC
force_test_dc = false

# Редиректы DC (формат: DC:IP,DC:IP)
# Пример: dc_ip = 1:149.154.175.50,2:149.154.167.51,4:149.154.167.91
dc_ip = 2:149.154.167.51,4:149.154.167.91
